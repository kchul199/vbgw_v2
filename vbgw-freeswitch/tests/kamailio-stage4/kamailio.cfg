#!KAMAILIO

listen=udp:0.0.0.0:5060
alias=stage4-kamailio
children=2
debug=2

loadmodule "pv.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

modparam("usrloc", "db_mode", 0)

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("REGISTER")) {
        xlog("L_INFO", "stage4 REGISTER from $fu contact=$ct\n");
        save("location");
        exit;
    }

    if (is_method("INVITE")) {
        xlog("L_INFO", "stage4 INVITE $rm $ru from=$fu via Kamailio to VBGW\n");
        if ($rU == "9296" || $rU == "1000" || $rU == "5551212") {
            record_route();
            $du = "sip:vbgw-freeswitch:5080";
            t_relay();
            exit;
        }
    }

    if (is_method("ACK|BYE|CANCEL|INFO|UPDATE|OPTIONS")) {
        if ($rU == "9296" || $rU == "1000" || $rU == "5551212") {
            $du = "sip:vbgw-freeswitch:5080";
        }
        t_relay();
        exit;
    }

    sl_send_reply("404", "Stage4 route not found");
}

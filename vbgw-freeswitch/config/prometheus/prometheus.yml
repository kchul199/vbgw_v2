global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'vbgw-orchestrator'
    static_configs:
      - targets: ['orchestrator:8080']
    metrics_path: /metrics
    bearer_token: '${ADMIN_API_KEY}'
    scrape_interval: 10s

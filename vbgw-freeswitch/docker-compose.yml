version: "3.9"

services:
  # ===== Tier 1: FreeSWITCH Media Engine =====
  freeswitch:
    build:
      context: .
      dockerfile: Dockerfile.freeswitch
    image: vbgw-freeswitch-freeswitch:latest
    platform: linux/amd64
    container_name: vbgw-freeswitch
    privileged: true
    entrypoint: ["/usr/local/bin/freeswitch-entrypoint.sh"]
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      - "8021:8021/tcp"
      - "16384-16484:16384-16484/udp"
    networks:
      vbgw-net:
        aliases:
          - freeswitch
          - vbgw-freeswitch
    volumes:
      - ./config/freeswitch:/etc/freeswitch
      - ./recordings:/recordings
      - ./logs/freeswitch:/var/log/freeswitch
    environment:
      - SIP_PORT=${SIP_PORT:-5060}
      - SIP_TLS_PORT=${SIP_TLS_PORT:-5061}
      - SIP_TLS_ONLY=${SIP_TLS_ONLY:-false}
      - SRTP_MODE=${SRTP_MODE:-optional}
      - EXTERNAL_RTP_IP=${EXTERNAL_RTP_IP:-auto-nat}
      - EXTERNAL_SIP_IP=${EXTERNAL_SIP_IP:-auto-nat}
      - INTERNAL_LOCAL_NETWORK_ACL=${INTERNAL_LOCAL_NETWORK_ACL:-localnet.auto}
      - VBGW_LOCALNET_CIDR=${VBGW_LOCALNET_CIDR:-127.0.0.0/8}
      - AUDIO_FORK_SCHEME=${AUDIO_FORK_SCHEME:-ws}
      - BRIDGE_HOST=${BRIDGE_HOST:-vbgw-bridge}
      - BRIDGE_WS_PORT=${BRIDGE_WS_PORT:-8090}
      - XML_CURL_DIALPLAN_URL=${XML_CURL_DIALPLAN_URL:-http://vbgw-orchestrator:8080/api/v1/fs/dialplan}
      - INBOUND_CODEC_PREFS=${INBOUND_CODEC_PREFS:-PCMU,PCMA,G722,OPUS}
      - OUTBOUND_CODEC_PREFS=${OUTBOUND_CODEC_PREFS:-PCMU,PCMA,G722,OPUS}
      - ESL_PASSWORD=${ESL_PASSWORD}
      - PBX_INTERCONNECT_ENABLED=${PBX_INTERCONNECT_ENABLED:-false}
      - PBX_MAIN_REGISTER=${PBX_MAIN_REGISTER:-true}
      - PBX_MAIN_PROXY=${PBX_MAIN_PROXY:-}
      - PBX_MAIN_REALM=${PBX_MAIN_REALM:-}
      - PBX_MAIN_USERNAME=${PBX_MAIN_USERNAME:-}
      - PBX_MAIN_PASSWORD=${PBX_MAIN_PASSWORD:-}
      - PBX_MAIN_EXTENSION=${PBX_MAIN_EXTENSION:-}
      - PBX_MAIN_FROM_USER=${PBX_MAIN_FROM_USER:-}
      - PBX_MAIN_FROM_DOMAIN=${PBX_MAIN_FROM_DOMAIN:-}
      - PBX_MAIN_REGISTER_PROXY=${PBX_MAIN_REGISTER_PROXY:-}
      - PBX_MAIN_EXPIRE_SECONDS=${PBX_MAIN_EXPIRE_SECONDS:-}
      - PBX_MAIN_RETRY_SECONDS=${PBX_MAIN_RETRY_SECONDS:-}
      - PBX_MAIN_PING_SECONDS=${PBX_MAIN_PING_SECONDS:-25}
      - PBX_MAIN_REGISTER_TRANSPORT=${PBX_MAIN_REGISTER_TRANSPORT:-udp}
      - PBX_MAIN_CALLER_ID_IN_FROM=${PBX_MAIN_CALLER_ID_IN_FROM:-false}
      - PBX_MAIN_CONTACT_PARAMS=${PBX_MAIN_CONTACT_PARAMS:-}
      - PBX_MAIN_EXTENSION_IN_CONTACT=${PBX_MAIN_EXTENSION_IN_CONTACT:-true}
      - PBX_STANDBY_ENABLED=${PBX_STANDBY_ENABLED:-false}
      - PBX_STANDBY_REGISTER=${PBX_STANDBY_REGISTER:-true}
      - PBX_STANDBY_PROXY=${PBX_STANDBY_PROXY:-}
      - PBX_STANDBY_REALM=${PBX_STANDBY_REALM:-}
      - PBX_STANDBY_USERNAME=${PBX_STANDBY_USERNAME:-}
      - PBX_STANDBY_PASSWORD=${PBX_STANDBY_PASSWORD:-}
      - PBX_STANDBY_EXTENSION=${PBX_STANDBY_EXTENSION:-}
      - PBX_STANDBY_FROM_USER=${PBX_STANDBY_FROM_USER:-}
      - PBX_STANDBY_FROM_DOMAIN=${PBX_STANDBY_FROM_DOMAIN:-}
      - PBX_STANDBY_REGISTER_PROXY=${PBX_STANDBY_REGISTER_PROXY:-}
      - PBX_STANDBY_EXPIRE_SECONDS=${PBX_STANDBY_EXPIRE_SECONDS:-}
      - PBX_STANDBY_RETRY_SECONDS=${PBX_STANDBY_RETRY_SECONDS:-}
      - PBX_STANDBY_PING_SECONDS=${PBX_STANDBY_PING_SECONDS:-25}
      - PBX_STANDBY_REGISTER_TRANSPORT=${PBX_STANDBY_REGISTER_TRANSPORT:-udp}
      - PBX_STANDBY_CALLER_ID_IN_FROM=${PBX_STANDBY_CALLER_ID_IN_FROM:-false}
      - PBX_STANDBY_CONTACT_PARAMS=${PBX_STANDBY_CONTACT_PARAMS:-}
      - PBX_STANDBY_EXTENSION_IN_CONTACT=${PBX_STANDBY_EXTENSION_IN_CONTACT:-true}
    healthcheck:
      test: ["CMD", "/usr/local/freeswitch/bin/fs_cli", "-p", "${ESL_PASSWORD}", "-x", "status"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ===== Tier 2: Redis State Store =====
  redis:
    image: redis:7.4-alpine
    container_name: vbgw-redis
    restart: unless-stopped
    command: ["redis-server", "--port", "16379", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "16379:16379"
    networks:
      vbgw-net:
        aliases:
          - vbgw-redis
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===== Tier 3: Bridge (VAD/Audio Fork) =====
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    image: vbgw-freeswitch-bridge:latest
    container_name: vbgw-bridge
    restart: unless-stopped
    ports:
      - "8090:8090"
    networks:
      vbgw-net:
        aliases:
          - bridge
          - vbgw-bridge
    volumes:
      - ./models:/models
    environment:
      - BRIDGE_INTERNAL_PORT=${BRIDGE_INTERNAL_PORT:-8091}
      - BRIDGE_WS_PORT=${BRIDGE_WS_PORT:-8090}
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - AI_GRPC_ADDR=vbgw-ai:8091
      - LOG_LEVEL=debug
      - RUNTIME_PROFILE=${RUNTIME_PROFILE:-production}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - ORT_API_VERSION=17
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "wget", "--header=X-Internal-Secret: ${INTERNAL_API_SECRET}", "-q", "-O-", "http://127.0.0.1:${BRIDGE_INTERNAL_PORT:-8091}/internal/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===== Tier 4: Orchestrator (Session Manager) =====
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    image: vbgw-freeswitch-orchestrator:latest
    container_name: vbgw-orchestrator
    restart: unless-stopped
    depends_on:
      freeswitch:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      vbgw-net:
        aliases:
          - orchestrator
          - vbgw-orchestrator
    environment:
      - HTTP_PORT=${HTTP_PORT:-8080}
      - ESL_HOST=${ESL_HOST:-freeswitch}
      - ESL_PORT=${ESL_PORT:-8021}
      - ESL_PASSWORD=${ESL_PASSWORD}
      - REDIS_ADDR=${REDIS_ADDR:-vbgw-redis:16379}
      - PBX_INTERCONNECT_ENABLED=${PBX_INTERCONNECT_ENABLED:-false}
      - PBX_MAIN_REGISTER=${PBX_MAIN_REGISTER:-true}
      - PBX_MAIN_GATEWAY=${PBX_MAIN_GATEWAY:-pbx-main}
      - PBX_STANDBY_ENABLED=${PBX_STANDBY_ENABLED:-false}
      - PBX_STANDBY_GATEWAY=${PBX_STANDBY_GATEWAY:-pbx-standby}
      - BRIDGE_INTERNAL_PORT=${BRIDGE_INTERNAL_PORT:-8091}
      - BRIDGE_HOST=${BRIDGE_HOST:-bridge}
      - AI_GRPC_ADDR=${AI_GRPC_ADDR:-vbgw-ai:8091}
      - NODE_ID=${NODE_ID:-vbgw-orchestrator}
      - ORCHESTRATOR_VERSION=${ORCHESTRATOR_VERSION:-7.0.0}
      - LEASE_SCHEMA_VERSION=${LEASE_SCHEMA_VERSION:-1}
      - CLUSTER_HEARTBEAT_INTERVAL_MS=${CLUSTER_HEARTBEAT_INTERVAL_MS:-2000}
      - CLUSTER_HEARTBEAT_TTL_MS=${CLUSTER_HEARTBEAT_TTL_MS:-8000}
      - CLUSTER_REAPER_INTERVAL_MS=${CLUSTER_REAPER_INTERVAL_MS:-5000}
      - CLUSTER_LEASE_TTL_MS=${CLUSTER_LEASE_TTL_MS:-15000}
      - CLUSTER_LEASE_STALE_GRACE_MS=${CLUSTER_LEASE_STALE_GRACE_MS:-10000}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ADMIN_CONTROL_KEY=${ADMIN_CONTROL_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - RUNTIME_PROFILE=${RUNTIME_PROFILE:-production}
      - ROUTING_CONFIG_PATH=${ROUTING_CONFIG_PATH:-/app/config/routing.yaml}
      - AI_ROUTE_NUMBERS=${AI_ROUTE_NUMBERS:-9196}
      - LOG_LEVEL=debug
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  vbgw-ai:
    container_name: vbgw-ai
    platform: linux/arm64
    build:
      context: ../vbgw-ai
      dockerfile: Dockerfile
    ports:
      - "50051:8091"
    networks:
      vbgw-net:
        aliases:
          - vbgw-ai
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - ../vbgw-ai/.env
    environment:
      - PORT=8091
      - LOG_LEVEL=debug
    restart: always

networks:
  vbgw-net:
    driver: bridge
